<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Classic Drop Liquid Glass</title>
  <desc>A translucent music player with a luminous glass drop.</desc>
  <defs>
