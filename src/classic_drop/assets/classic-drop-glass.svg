      <stop offset=".7" stop-color="#359fdf" stop-opacity=".91"/><stop offset="1" stop-color="#4969d8" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
